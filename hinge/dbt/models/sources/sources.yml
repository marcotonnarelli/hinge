# dbt source declaration.
#
# DbtProjection creates dataset-scoped views before every dbt run.
#
# Core HIN projections should reference:
#   {{ source('hin', 'active_hin_nodes') }}
#   {{ source('hin', 'active_hin_edges') }}
#
# The legacy active_nodes / active_edges sources remain for old projections only.
# Never reference base tables directly — they contain all datasets.
version: 2

sources:
  - name: hin
    schema: main
    tables:
      - name: active_nodes
        description: "View over nodes filtered to the active dataset_id."
        columns:
          - name: type
            description: "NodeType — 'user', 'repo', 'artifact'."
          - name: id
          - name: ts
          - name: attrs
      - name: active_edges
        description: "View over edges filtered to the active dataset_id."
        columns:
          - name: type
            description: "EdgeType — 'opened', 'reviewed', etc."
          - name: src_id
          - name: dst_id
          - name: ts
          - name: attrs
      - name: active_contract_accounts
        description: "Adapter contract accounts for the active dataset_id."
      - name: active_contract_repositories
        description: "Adapter contract repositories for the active dataset_id."
      - name: active_contract_artifacts
        description: "Adapter contract artifacts for the active dataset_id."
      - name: active_contract_relations
        description: "Adapter contract relations for the active dataset_id."
      - name: active_contract_adapter_manifest
        description: "Adapter manifest/capabilities for the active dataset_id."
      - name: active_hin_nodes
        description: "Canonical HIN node view from HIN_DBT_DESIGN.md, filtered to the active dataset_id."
        columns:
          - name: node_id
          - name: node_type
          - name: node_subtype
          - name: natural_key
          - name: display_name
          - name: properties
      - name: active_hin_edges
        description: "Canonical HIN edge view from HIN_DBT_DESIGN.md, filtered to the active dataset_id."
        columns:
          - name: edge_id
          - name: source_node_id
          - name: source_node_type
          - name: target_node_id
          - name: target_node_type
          - name: edge_type
          - name: relation_subtype
          - name: properties
