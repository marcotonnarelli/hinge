[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hinge"
version = "0.1.0"
description = "Heterogeneous Information Network tool for GitHub research datasets"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Filippo Scaramuzza", email = "f.scaramuzza@tue.nl" },
    { name = "Marco Tonnarelli", email = "m.tonnarelli@tue.nl" },
    { name = "Gergő Bocsárdi", email = "a.g.bocsardi@tue.nl" },
]
keywords = ["github", "heterogeneous-information-network", "graph", "mining", "duckdb", "dbt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "orjson>=3.10",
    "duckdb>=1.0",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "networkx>=3.3",
    "pyarrow>=16.0",
]

[project.urls]
Homepage = "https://github.com/marcotonnarelli/hinge"
Repository = "https://github.com/marcotonnarelli/hinge"
Issues = "https://github.com/marcotonnarelli/hinge/issues"

[project.optional-dependencies]
tui = ["textual>=0.70"]
web = ["fastapi>=0.111", "uvicorn>=0.30"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "import-linter>=2.0",
    "types-PyYAML",
]

[project.scripts]
hinge = "hinge.frontends.cli.app:app"

# -------------------------------------------------------------------------
# Stage entry-points
# -------------------------------------------------------------------------
# The registry discovers stages at startup by reading these groups. Only
# register a stage here once it has tests.

[project.entry-points."hinge.readers"]
numfocus = "hinge.stages.readers.numfocus_reader:NumFocusReader"

[project.entry-points."hinge.stores"]
duckdb = "hinge.stages.store.duckdb_store:DuckDBStore"

[project.entry-points."hinge.projections"]
dbt = "hinge.stages.projection.dbt_projection:DbtProjection"

# ProjectionSpec instances — one entry-point per task-specific subgraph.
# Symmetric with readers/exporters: third-party packages add new projections
# the same way.
[project.entry-points."hinge.projection_specs"]
artifact-artifact-reference     = "hinge.stages.projection.specs.artifact_reference:SPEC"
repo-repo-fork                  = "hinge.stages.projection.specs.fork_repo_repo:SPEC"
repo-repo-shared-contributors   = "hinge.stages.projection.specs.repo_shared_contributors:SPEC"
user-issue-participation        = "hinge.stages.projection.specs.issue_participation:SPEC"
user-pr-participation           = "hinge.stages.projection.specs.pr_participation:SPEC"
user-repo-affiliation           = "hinge.stages.projection.specs.developer_repo_affiliation:SPEC"
user-repo-star                  = "hinge.stages.projection.specs.star_user_repo:SPEC"
user-repo-watch                 = "hinge.stages.projection.specs.watch_user_repo:SPEC"
user-user-co-commit             = "hinge.stages.projection.specs.co_commit_user_user:SPEC"
user-user-co-edit-file          = "hinge.stages.projection.specs.co_edit_file_user_user:SPEC"
user-user-co-edit-line          = "hinge.stages.projection.specs.co_edit_line_user_user:SPEC"
user-user-follow                = "hinge.stages.projection.specs.follow_user_user:SPEC"
user-user-issue-co-participation = "hinge.stages.projection.specs.issue_co_participation:SPEC"
user-user-mention               = "hinge.stages.projection.specs.user_mention_user:SPEC"
user-user-pr-author-reviewer    = "hinge.stages.projection.specs.pr_author_reviewer:SPEC"
user-user-pr-co-review          = "hinge.stages.projection.specs.pr_reviewer_coreview:SPEC"
user-user-repo-collaboration    = "hinge.stages.projection.specs.dev_interaction:SPEC"

[project.entry-points."hinge.exporters"]
csv = "hinge.stages.exporters.csv_exporter:CsvExporter"
gml = "hinge.stages.exporters.gml_exporter:GmlExporter"
networkx = "hinge.stages.exporters.networkx_exporter:NetworkXExporter"

# -------------------------------------------------------------------------
# Hatch packaging
# -------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["hinge"]
exclude = [
    "hinge/dbt/target",
    "hinge/dbt/logs",
    "hinge/dbt/dbt_packages",
    "hinge/stages/projection/target",
    "hinge/stages/projection/logs",
]

[tool.hatch.build.targets.sdist]
include = [
    "hinge",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    "hinge/dbt/target",
    "hinge/dbt/logs",
    "hinge/dbt/dbt_packages",
    "hinge/stages/projection/target",
    "hinge/stages/projection/logs",
]

# -------------------------------------------------------------------------
# Tooling
# -------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # function call in default argument — idiomatic Typer pattern
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["hinge.kernel.*", "hinge.frontends.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# -------------------------------------------------------------------------
# import-linter — enforces the kernel/stages/frontends boundary
# -------------------------------------------------------------------------
[tool.importlinter]
root_package = "hinge"

[[tool.importlinter.contracts]]
name = "Kernel has no dependency on stages or frontends"
type = "forbidden"
source_modules = ["hinge.kernel"]
forbidden_modules = ["hinge.stages", "hinge.frontends"]

[[tool.importlinter.contracts]]
name = "Stages do not import other stages or frontends"
type = "forbidden"
source_modules = ["hinge.stages"]
forbidden_modules = ["hinge.frontends"]

[[tool.importlinter.contracts]]
name = "Frontends do not import concrete stages"
type = "forbidden"
source_modules = ["hinge.frontends"]
forbidden_modules = ["hinge.stages"]
